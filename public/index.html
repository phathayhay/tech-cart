<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart - Modern User Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Floating animated background blobs -->
    <div class="bg-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Toast Notification System -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Confirmation Dialog -->
    <div id="confirmation-dialog" class="confirmation-dialog hidden">
      <div class="confirmation-content">
        <h3 id="confirmation-title">Confirm Action</h3>
        <p id="confirmation-message">Are you sure?</p>
        <div class="confirmation-actions">
          <button id="confirmation-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button id="confirmation-confirm-btn" class="btn btn-danger">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Global Header / Navbar -->
    <header id="main-header" class="main-header hidden">
      <div class="header-container">
        <a href="#/" class="logo">
          <img src="/images/logo.png" alt="TechCart Logo" class="brand-logo-img" />
          <span>Tech<span>Cart</span></span>
        </a>
        <div class="user-menu">
          <button id="cart-toggle-btn" class="btn btn-secondary btn-icon-only cart-btn" title="Open Cart">
            <i data-lucide="shopping-cart"></i>
            <span id="cart-badge" class="cart-badge hidden">0</span>
          </button>
          <div id="header-logged-in" class="header-logged-in hidden">
            <button id="header-dashboard-btn" type="button" class="header-user-info header-dashboard-btn" title="Go to Dashboard">
              <img
                id="header-avatar"
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop"
                alt="Avatar"
                class="header-avatar"
              />
              <span id="header-username" class="header-username">Loading...</span>
              <i data-lucide="layout-dashboard" class="header-dashboard-icon"></i>
            </button>
            <button id="logout-btn" class="btn btn-secondary btn-icon-only" title="Logout">
              <i data-lucide="log-out"></i>
            </button>
          </div>
          <div id="header-guest" class="header-guest hidden">
            <a href="#/login" class="btn btn-secondary btn-sm">Login</a>
            <a href="#/register" class="btn btn-primary btn-sm">Register</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Cart Drawer Overlay -->
    <div id="cart-overlay" class="cart-overlay hidden"></div>
    <aside id="cart-drawer" class="cart-drawer">
      <div class="cart-drawer-header">
        <h2><i data-lucide="shopping-cart"></i> Your Cart</h2>
        <button id="cart-close-btn" class="btn btn-secondary btn-icon-only" title="Close Cart">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="cart-items-container" class="cart-items-container">
        <div id="cart-empty-state" class="cart-empty-state">
          <i data-lucide="shopping-bag"></i>
          <p>Your cart is empty</p>
          <a href="#/" class="btn btn-primary btn-sm" id="cart-shop-link">Browse Products</a>
        </div>
      </div>
      <div class="cart-drawer-footer">
        <div class="checkout-fields">
          <label for="checkout-payment-method">Payment Method</label>
          <select id="checkout-payment-method">
            <option value="cod">Cash on Delivery</option>
            <option value="card">Mock Card Payment</option>
            <option value="bank_transfer">Bank Transfer</option>
          </select>
          <label for="checkout-shipping-address">Shipping Address</label>
          <textarea id="checkout-shipping-address" rows="2" placeholder="Enter your delivery address"></textarea>
          <label for="checkout-note">Order Note</label>
          <textarea id="checkout-note" rows="2" placeholder="Optional delivery note"></textarea>
        </div>
        <div class="cart-total-row">
          <span>Total</span>
          <span id="cart-total-amount" class="cart-total-amount">0 ₫</span>
        </div>
        <button id="checkout-btn" class="btn btn-primary btn-block" disabled>
          <i data-lucide="credit-card"></i> Checkout
        </button>
      </div>
    </aside>

    <!-- Go to Top Button -->
    <button id="go-to-top-btn" class="go-to-top-btn hidden" title="Back to top">
      <i data-lucide="arrow-up"></i>
    </button>

    <!-- Main Container (Views loaded dynamically from ./views/*.html) -->
    <main id="app-main" class="app-container"></main>

    <script type="module" src="app.js"></script>
  </body>
</html>
